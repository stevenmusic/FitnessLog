<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Fitness Log Pro</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Poppins:wght@600;800&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Noto Sans TC','Poppins',sans-serif;
    background: radial-gradient(circle at top left,#3b82f6,transparent 40%),
                radial-gradient(circle at top right,#ef4444,transparent 40%),
                linear-gradient(180deg,#0b1120,#111827);
    min-height:100vh;
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px;
    backdrop-filter:blur(20px);
    overflow:hidden;
}

header{
    padding:40px;
    text-align:center;
    background:linear-gradient(135deg,#2563eb,#ef4444);
}

h1{font-size:2.5em;font-weight:800;}
.subtitle{opacity:.9;margin-top:8px}

.form{
    padding:30px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:700;
}

input,textarea{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:none;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
}

textarea{min-height:80px}

.section-title{
    margin-top:25px;
    font-size:1.2em;
    font-weight:800;
}

.grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.exercise-card{
    width:calc(50% - 5px);
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    cursor:pointer;
    transition:.2s;
}

.exercise-card:hover{
    transform:translateY(-3px);
}

.exercise-card.selected{
    border:2px solid #60a5fa;
    box-shadow:0 0 20px rgba(96,165,250,.4);
}

.workout-list{
    margin-top:20px;
}

.workout-item{
    background:rgba(255,255,255,0.06);
    padding:16px;
    border-radius:18px;
    margin-bottom:12px;
}

.workout-item h3{
    margin-bottom:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
}

.row button{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    font-size:18px;
    cursor:pointer;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:999px;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#ef4444,#f59e0b);
    color:white;
}

.output{
    margin-top:20px;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:16px;
    white-space:pre-wrap;
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1>🔥 Fitness Log Pro</h1>
    <div class="subtitle">快速紀錄你的訓練進度</div>
</header>

<div class="form">

<label>日期</label>
<input type="date" id="date">

<label>體重 (kg)</label>
<input type="number" id="weight">

<div class="section-title">選擇動作</div>

<div class="grid">

<div class="exercise-card" onclick="addExercise(this,'Bench Press')">Bench Press</div>
<div class="exercise-card" onclick="addExercise(this,'Squat')">Squat</div>
<div class="exercise-card" onclick="addExercise(this,'Deadlift')">Deadlift</div>
<div class="exercise-card" onclick="addExercise(this,'Pull Up')">Pull Up</div>
<div class="exercise-card" onclick="addExercise(this,'Shoulder Press')">Shoulder Press</div>
<div class="exercise-card" onclick="addExercise(this,'Cable Fly')">Cable Fly</div>

</div>

<div class="section-title">今日訓練</div>
<div id="workoutList" class="workout-list"></div>

<button class="btn" onclick="generate()">產生紀錄</button>

<div id="output" class="output" style="display:none;"></div>

</div>
</div>

<script>

let workouts = {};

function addExercise(el,name){

    el.classList.toggle("selected");

    if(!workouts[name]){
        workouts[name] = { weight:60, reps:8, sets:4 };
    }else{
        delete workouts[name];
    }

    render();
}

function render(){

    let container = document.getElementById("workoutList");
    container.innerHTML = "";

    for(let name in workouts){

        let w = workouts[name];

        let div = document.createElement("div");
        div.className = "workout-item";

        div.innerHTML = `
            <h3>${name}</h3>

            <div class="row">
                <span>Weight</span>
                <div>
                    <button onclick="change('${name}','weight',-2.5)">-</button>
                    ${w.weight}
                    <button onclick="change('${name}','weight',2.5)">+</button>
                </div>
            </div>

            <div class="row">
                <span>Reps</span>
                <div>
                    <button onclick="change('${name}','reps',-1)">-</button>
                    ${w.reps}
                    <button onclick="change('${name}','reps',1)">+</button>
                </div>
            </div>

            <div class="row">
                <span>Sets</span>
                <div>
                    <button onclick="change('${name}','sets',-1)">-</button>
                    ${w.sets}
                    <button onclick="change('${name}','sets',1)">+</button>
                </div>
            </div>
        `;

        container.appendChild(div);
    }
}

function change(name,type,val){
    workouts[name][type] += val;
    if(workouts[name][type] < 0) workouts[name][type]=0;
    render();
}

function generate(){

    let date = document.getElementById("date").value;
    let weight = document.getElementById("weight").value;

    let md = `# 🔥 Workout Log ${date}\n\n`;

    if(weight) md += `Body Weight: ${weight} kg\n\n`;

    md += `## Training\n`;

    for(let name in workouts){
        let w = workouts[name];
        md += `- ${name} — ${w.weight}kg × ${w.reps} × ${w.sets}\n`;
    }

    document.getElementById("output").style.display="block";
    document.getElementById("output").textContent = md;
}

document.getElementById("date").valueAsDate = new Date();

</script>

</body>
</html>
